<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Name — JESUS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; overflow: hidden; }

  body {
    background: #05060f;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 900px;
  }

  /* ---- Nebula background ---- */
  .nebula {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 30%, rgba(88, 60, 180, .35), transparent 60%),
      radial-gradient(ellipse 60% 50% at 20% 80%, rgba(20, 60, 140, .3), transparent 60%),
      radial-gradient(ellipse 50% 40% at 80% 70%, rgba(140, 90, 20, .18), transparent 60%),
      #05060f;
    animation: nebulaPulse 12s ease-in-out infinite alternate;
  }
  @keyframes nebulaPulse {
    from { filter: brightness(.85); }
    to   { filter: brightness(1.15); }
  }

  canvas#stars { position: fixed; inset: 0; display: block; }

  /* ---- Central light burst ---- */
  .burst {
    position: fixed;
    top: 50%; left: 50%;
    width: 130vmin; height: 130vmin;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle,
      rgba(255, 240, 200, .30) 0%,
      rgba(255, 200, 90, .12) 22%,
      rgba(120, 80, 200, .06) 45%,
      transparent 68%);
    animation: burstPulse 5s ease-in-out infinite alternate;
    pointer-events: none;
  }
  @keyframes burstPulse {
    from { opacity: .55; transform: translate(-50%, -50%) scale(.95); }
    to   { opacity: 1;   transform: translate(-50%, -50%) scale(1.08); }
  }

  /* ---- God rays ---- */
  .rays {
    position: fixed;
    top: 50%; left: 50%;
    width: 200vmax; height: 200vmax;
    transform: translate(-50%, -50%);
    background: repeating-conic-gradient(from 0deg,
      rgba(255, 235, 170, .10) 0deg 4deg,
      transparent 4deg 14deg);
    animation: spin 90s linear infinite;
    mask-image: radial-gradient(circle, black 0%, transparent 55%);
    -webkit-mask-image: radial-gradient(circle, black 0%, transparent 55%);
    pointer-events: none;
  }
  @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

  /* ---- 3D stage ---- */
  .stage {
    position: relative;
    text-align: center;
    transform-style: preserve-3d;
    transition: transform .12s ease-out;
    transform: rotateX(14deg);
  }

  /* ---- Extruded 3D Name ---- */
  .name3d {
    position: relative;
    transform-style: preserve-3d;
    font-size: clamp(3.5rem, 19vw, 12rem);
    font-weight: 900;
    letter-spacing: .06em;
    line-height: 1;
    text-transform: uppercase;
    animation: nameIn 1.4s cubic-bezier(.2, .8, .2, 1) both;
  }
  @keyframes nameIn {
    from { opacity: 0; transform: translateY(90px) scale(1.7); filter: blur(14px); }
    to   { opacity: 1; transform: translateY(0) scale(1);    filter: blur(0); }
  }

  .n {
    position: absolute; inset: 0;
    white-space: nowrap;
  }

  /* front face — polished gold */
  .n1 {
    position: relative;
    background: linear-gradient(178deg, #fffcf2 0%, #ffedb0 30%, #f7bf3a 58%, #c67f00 88%, #8a5400 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    -webkit-text-stroke: 1px rgba(120, 70, 0, .35);
    transform: translateZ(0);
    filter:
      drop-shadow(0 0 16px rgba(255, 200, 60, .5))
      drop-shadow(0 0 55px rgba(255, 160, 20, .3));
    animation: faceGlow 4s ease-in-out infinite alternate;
  }
  @keyframes faceGlow {
    from { filter:
        drop-shadow(0 0 12px rgba(255, 200, 60, .4))
        drop-shadow(0 0 40px rgba(255, 160, 20, .22)); }
    to   { filter:
        drop-shadow(0 0 24px rgba(255, 215, 90, .75))
        drop-shadow(0 0 80px rgba(255, 170, 30, .45)); }
  }

  /* extrusion layer 1 */
  .n2 {
    color: #a86d04;
    transform: translateZ(-7px);
  }

  /* extrusion layer 2 — deep bronze */
  .n3 {
    color: #5d3a00;
    transform: translateZ(-14px);
  }

  /* extrusion layer 3 — darkest shadow base */
  .n4 {
    color: #2e1c00;
    transform: translateZ(-22px);
  }

  /* sharp bevel edge highlight on front face */
  .n1::before {
    content: "JESUS";
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,0) 38%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    pointer-events: none;
  }

  /* ---- Floor shadow (sells the height) ---- */
  .floor {
    position: absolute;
    left: 50%; top: 112%;
    width: 92%; height: 12px;
    transform: translateX(-50%) translateZ(-40px);
    background: radial-gradient(ellipse at center,
      rgba(0, 0, 0, .85) 0%, rgba(20, 10, 0, .5) 40%, transparent 72%);
    filter: blur(6px);
    border-radius: 50%;
    animation: floorBreathe 4s ease-in-out infinite alternate;
  }
  @keyframes floorBreathe {
    from { opacity: .55; transform: translateX(-50%) translateZ(-40px) scaleX(.94); }
    to   { opacity: .85; transform: translateX(-50%) translateZ(-40px) scaleX(1.03); }
  }

  /* ---- Glass caption card ---- */
  .card {
    margin-top: 12vh;
    display: inline-block;
    padding: 18px 34px;
    border-radius: 22px;
    background: rgba(255, 255, 255, .05);
    border: 1px solid rgba(255, 255, 255, .14);
    box-shadow:
      0 8px 40px rgba(0, 0, 0, .5),
      inset 0 1px 0 rgba(255, 255, 255, .18);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    opacity: 0;
    animation: fadeUp 1.2s ease 1.5s forwards;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card .line1 {
    color: #fff7e0;
    font-size: clamp(.95rem, 2.6vw, 1.25rem);
    font-weight: 600;
    letter-spacing: .04em;
    text-shadow: 0 0 14px rgba(255, 210, 100, .35);
  }

  .card .line2 {
    margin-top: 6px;
    color: rgba(255, 240, 210, .55);
    font-size: clamp(.7rem, 1.8vw, .85rem);
    letter-spacing: .22em;
    text-transform: uppercase;
  }

  /* faint floating dust */
  .dust {
    position: fixed; inset: 0; pointer-events: none;
    background-image:
      radial-gradient(2px 2px at 12% 30%, rgba(255,230,170,.35), transparent),
      radial-gradient(1.5px 1.5px at 78% 65%, rgba(255,230,170,.28), transparent),
      radial-gradient(2px 2px at 55% 15%, rgba(255,230,170,.22), transparent),
      radial-gradient(1.5px 1.5px at 33% 82%, rgba(255,230,170,.3), transparent);
    animation: drift 14s ease-in-out infinite alternate;
  }
  @keyframes drift {
    from { transform: translateY(12px); opacity: .5; }
    to   { transform: translateY(-12px); opacity: 1; }
  }
</style>
</head>
<body>
  <div class="nebula"></div>
  <canvas id="stars"></canvas>
  <div class="burst"></div>
  <div class="rays"></div>
  <div class="dust"></div>

  <div class="stage" id="stage">
    <div class="name3d" aria-label="Jesus">
      <span class="n n4">JESUS</span>
      <span class="n n3">JESUS</span>
      <span class="n n2">JESUS</span>
      <span class="n n1">JESUS</span>
      <div class="floor"></div>
    </div>
    <div class="card">
      <div class="line1">The Name above every name</div>
      <div class="line2">Philippians 2 : 9</div>
    </div>
  </div>

<script>
  /* ---- starfield ---- */
  const c = document.getElementById('stars');
  const ctx = c.getContext('2d');
  let stars = [], W, H;

  function resize() {
    W = c.width = innerWidth;
    H = c.height = innerHeight;
    stars = Array.from({ length: Math.min(260, W * H / 6000) }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.3 + .2,
      a: Math.random(),
      da: (Math.random() * .012 + .004) * (Math.random() < .5 ? 1 : -1),
      vy: -(Math.random() * .06 + .01)
    }));
  }
  resize();
  addEventListener('resize', resize);

  (function draw() {
    ctx.clearRect(0, 0, W, H);
    for (const s of stars) {
      s.a += s.da;
      if (s.a > 1 || s.a < 0) { s.a = Math.max(0, Math.min(1, s.a)); s.da *= -1; }
      s.y += s.vy;
      if (s.y < -2) { s.y = H + 2; s.x = Math.random() * W; }
      ctx.globalAlpha = Math.abs(s.a) * .9;
      ctx.fillStyle = s.r > 1 ? '#ffe9b0' : '#ffffff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, 6.2832);
      ctx.fill();
    }
    requestAnimationFrame(draw);
  })();

  /* ---- Sharp 3D tilt on pointer ---- */
  const stage = document.getElementById('stage');
  addEventListener('pointermove', e => {
    const px = e.clientX / innerWidth - .5;
    const py = e.clientY / innerHeight - .5;
    const rx = 14 + py * -18;   /* base lean + pointer */
    const ry = px * 24;
    const tz = Math.abs(px) * 26 + Math.abs(py) * 18; /* pop toward viewer */
    stage.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg) translateZ(${tz}px)`;
  });
  addEventListener('pointerleave', () => {
    stage.style.transform = 'rotateX(14deg) rotateY(0deg) translateZ(0px)';
  });
</script>
</body>
</html>
